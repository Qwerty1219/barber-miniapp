<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Барбершоп Север</title>
    
    <!-- Подключаем скрипт Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f0f0f;
            --surface-color: #1c1c1e;
            --primary-gold: #d4af37;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border-radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 90px; 
            user-select: none;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 20px 15px;
            background: linear-gradient(180deg, rgba(28,28,30,1) 0%, rgba(15,15,15,1) 100%);
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        }

        .logo-img {
            width: 100px;
            height: auto;
            margin-bottom: 10px;
            object-fit: contain;
        }

        .brand-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .brand-subtitle {
            font-size: 11px;
            color: var(--primary-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .main-content {
            padding: 20px;
        }

        h2.section-title {
            font-size: 18px;
            font-weight: 700;
            margin: 20px 0 15px;
            display: flex;
            align-items: center;
        }

        h2.section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 18px;
            background: var(--primary-gold);
            margin-right: 10px;
            border-radius: 2px;
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-info { flex: 1; padding-right: 15px; }
        .card-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .card-desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; }

        .master-card { display: flex; align-items: center; gap: 15px; }
        .master-avatar {
            width: 50px; height: 50px; border-radius: 50%;
            background: #333; display: flex; justify-content: center; align-items: center;
            font-size: 20px; border: 2px solid var(--primary-gold);
        }

        .contact-item {
            display: flex; align-items: center; gap: 12px; margin-bottom: 15px;
            background: var(--surface-color); padding: 15px; border-radius: var(--border-radius);
        }
        .contact-icon { font-size: 24px; }
        .contact-text { font-size: 14px; }
        .contact-text a { color: var(--primary-gold); text-decoration: none; }

        .bottom-bar {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            padding: 15px 20px;
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 100;
        }

        .main-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-gold) 0%, #b8952e 100%);
            color: #000;
            font-weight: 700;
            font-size: 16px;
            padding: 16px;
            border-radius: 50px;
            text-align: center;
            border: none;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .main-btn:active { transform: scale(0.98); }

        .secondary-btn {
            width: 100%;
            background: transparent;
            color: var(--primary-gold);
            font-weight: 600;
            font-size: 14px;
            padding: 12px;
            border-radius: 50px;
            border: 1px solid var(--primary-gold);
            text-align: center;
            cursor: pointer;
        }
        .secondary-btn:active { background: rgba(212, 175, 55, 0.1); }

    </style>
</head>
<body>

    <header>
        <img src="sever.png" alt="Север" class="logo-img">
        <div class="brand-title">Север</div>
        <div class="brand-subtitle">Мужские стрижки</div>
    </header>

    <main class="main-content">
        
        <h2 class="section-title">Наши мастера</h2>
        <div class="card-list">
            <div class="card master-card">
                <div class="master-avatar">👨🏽‍🦱</div>
                <div class="card-info">
                    <div class="card-title">Оганес</div>
                    <div class="card-desc">Барбер • ★ 5.0</div>
                </div>
            </div>
            <div class="card master-card">
                <div class="master-avatar">🧔🏻</div>
                <div class="card-info">
                    <div class="card-title">Сергей</div>
                    <div class="card-desc">Топ-барбер • ★ 5.0</div>
                </div>
            </div>
        </div>

        <h2 class="section-title">Контакты</h2>
        <div class="contact-item">
            <div class="contact-icon">📍</div>
            <div class="contact-text">
                <a href="https://yandex.com/maps/org/sever/129767749048/" target="_blank">Мы на Яндекс.Картах</a>
            </div>
        </div>
        <div class="contact-item">
            <div class="contact-icon">📞</div>
            <div class="contact-text">+7 (925) 378-26-31</div>
        </div>
        <div class="contact-item">
            <div class="contact-icon">✈️</div>
            <div class="contact-text"><a href="https://t.me/everythingsaholic">@everythingsaholic</a></div>
        </div>
        <div class="contact-item">
            <div class="contact-icon">🕒</div>
            <div class="contact-text">Ежедневно с 10:00 до 21:00</div>
        </div>

    </main>

    <div class="bottom-bar">
        <!-- Кнопка для перехода к прайсу в боте -->
        <button class="secondary-btn" onclick="goToBot('price')">Посмотреть актуальный прайс</button>
        <!-- Кнопка для записи -->
        <button class="main-btn" onclick="goToBot('book')">Записаться онлайн</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0f0f0f');
        tg.setBackgroundColor('#0f0f0f');

        function goToBot(action) {
            tg.HapticFeedback.notificationOccurred('success');
            
            // Отправляем боту команду, какую кнопку нажали
            // Бот поймает это и либо откроет прайс, либо начнет запись
            tg.sendData(JSON.stringify({ action: action }));
            
            // Закрываем мини-апп
            tg.close();
        }
    </script>
</body>
</html>
